[project]
name = "refundops"
version = "0.1.0"
description = "RefundOps: an AI investigator for PayPal disputes, built for the PayPal AI Hackathon."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # web app
    "django>=6.1,<6.2",
    "uvicorn>=0.32",
    "whitenoise>=6.8",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=43.0",
    "pydantic>=2.0,<3.0",
    # agent (vendored Navgent core lives in navgent/)
    "deepagents>=0.7.25,<0.8",
    "langgraph>=1.2.15,<2.0",
    "langchain>=1.4.6,<2.0",
    "langchain-core>=1.6.10,<2.0",
    "langchain-openai>=1.7.2,<2.0",
    "langchain-quickjs>=0.3.9,<0.4",
    "playwright>=1.64.0,<2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-django>=4.9",
    "pytest-asyncio>=0.24",
    "pytest-timeout>=2.4.0",
    "ruff>=0.15.17",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "RefundOpsAI.settings"
testpaths = ["tests"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
timeout = 60

[tool.ruff]
extend-exclude = ["navgent", "docs", ".worktrees", ".venv"]
lint.select = ["E", "F", "I", "UP"]
lint.ignore = ["E501", "UP006", "UP007", "UP040", "E402"]

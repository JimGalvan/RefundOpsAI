{% extends "demo_sites/base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}<section class="login sheet"><h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/login/">{% csrf_token %}
<label for="email">Email</label><input id="email" name="email" type="email" value="{{ email }}" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button type="submit">Sign in</button></form></section>{% endblock %}

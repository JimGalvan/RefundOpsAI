{% extends "base.html" %}
{% block content %}
<section class="mx-auto max-w-3xl px-4 py-16" x-data="{ open: false }">
  <h1 class="text-3xl font-semibold tracking-tight">RefundOps</h1>
  <p class="mt-2 text-slate-600">An AI investigator for PayPal disputes. The scaffold is running.</p>
  <div class="mt-8 flex items-center gap-3">
    <button class="rounded-md bg-slate-900 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700"
            hx-get="{% url 'health' %}" hx-target="#health-result" hx-swap="innerHTML">
      Check server
    </button>
    <button class="rounded-md border border-slate-300 px-4 py-2 text-sm"
            @click="open = !open" x-text="open ? 'Hide stack' : 'Show stack'"></button>
  </div>
  <pre id="health-result" class="mt-4 text-sm text-slate-700"></pre>
  <ul x-show="open" x-cloak class="mt-4 list-disc pl-6 text-sm text-slate-600">
    <li>Django + HTMX + Alpine.js + Tailwind</li>
  </ul>
</section>
{% endblock %}
